<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>이음이 · 관리자 대시보드 (서초 어르신 행복이음)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 :root{--brand:#15704f;--brand2:#1f9b6c;--warm:#f59e0b;--cream:#fbf7ef}
 body{font-family:'Noto Sans KR',sans-serif;color:#14372a;background:#eef2f0}
 .material-symbols-outlined{font-variation-settings:'FILL' 1;vertical-align:middle}
 header{background:linear-gradient(120deg,#0f5c40,#1f9b6c);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
 header .lt{display:flex;align-items:center;gap:10px}
 header .logo{background:#fff;color:var(--brand);border-radius:9px;padding:3px 9px;font-weight:900;font-size:14px}
 header h1{font-size:18px;font-weight:800}
 header .rt{font-size:13px;color:#d9f5ea}
 .wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
 /* 통계 */
 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
 .stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px 16px}
 .stat .n{font-size:26px;font-weight:900;color:var(--brand)}
 .stat.urg .n{color:#dc2626}
 .stat .l{font-size:13px;color:#64748b;font-weight:700;margin-top:2px}
 /* 필터 */
 .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
 .tab{background:#fff;border:1.5px solid #e2e8f0;border-radius:999px;padding:7px 15px;font-weight:800;font-size:14px;cursor:pointer;color:#475569}
 .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
 .setbar{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
 .setbar .hint{color:#94a3b8;font-size:12px}
 .rstate{font-weight:800;color:#dc2626}
 .rstate.on{color:#15803d}
 .switch{position:relative;display:inline-block;width:44px;height:24px}
 .switch input{opacity:0;width:0;height:0}
 .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s;cursor:pointer}
 .sl::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
 .switch input:checked + .sl{background:var(--brand)}
 .switch input:checked + .sl::before{transform:translateX(20px)}
 .b-mem{background:#dcfce7;color:#15803d}.b-unreg{background:#fef3c7;color:#b45309}
 /* 카드 */
 .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px 18px;margin-bottom:12px;border-left:5px solid #cbd5e1}
 .card.c-urgent{border-left-color:#dc2626;background:#fff5f5}
 .card.c-job{border-left-color:#1f9b6c}
 .card.c-health{border-left-color:#3b82f6}
 .card.c-welfare{border-left-color:#8b5cf6}
 .card.c-etc{border-left-color:#94a3b8}
 .card.done-c{opacity:.6}
 .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
 .pill{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
 .p-job{background:#dcfce7;color:#15803d}.p-health{background:#dbeafe;color:#1d4ed8}
 .p-welfare{background:#ede9fe;color:#6d28d9}.p-urgent{background:#fee2e2;color:#b91c1c}
 .p-etc{background:#e2e8f0;color:#475569}
 .badge{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
 .b-urg{background:#dc2626;color:#fff}.b-fu{background:#fef3c7;color:#b45309}
 .time{margin-left:auto;color:#94a3b8;font-size:12px}
 .name{font-size:17px;font-weight:900}
 .summary{margin:5px 0;color:#334155;line-height:1.5}
 .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
 .chip{background:#f1f5f9;border-radius:8px;padding:3px 9px;font-size:12px;color:#475569;font-weight:600}
 details{margin-top:6px}
 summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--brand)}
 .tr{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-top:6px}
 .tr .u{color:#64748b}.tr .b{color:var(--brand);font-weight:600}
 .tr div{margin:3px 0;font-size:13px;line-height:1.5}
 .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0}
 .st{display:flex;gap:4px}
 .st button{font-family:inherit;font-size:12px;font-weight:800;border:1.5px solid #e2e8f0;background:#fff;color:#475569;border-radius:8px;padding:5px 11px;cursor:pointer}
 .st button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
 .memo{flex:1;min-width:150px;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:13px}
 .fu{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#b45309;cursor:pointer}
 footer{text-align:center;color:#94a3b8;font-size:12px;padding:20px}
 header .rt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
 header .rt a{color:#d9f5ea;font-size:13px;text-decoration:none;font-weight:700}
 /* 로그인 정보 막대 — sign-in strip (assets/ieumi-api.js renders into it) */
 .userbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#d9f5ea}
 .userbar .ib-who{font-weight:700}
 .userbar .ib-center-name{background:rgba(255,255,255,.15);border-radius:999px;padding:3px 10px;font-weight:700}
 .userbar .ib-center{font-family:inherit;font-size:12.5px;font-weight:700;padding:4px 8px;
   border-radius:8px;border:none;background:rgba(255,255,255,.92);color:#14372a;max-width:200px}
 .userbar .ib-out{font-family:inherit;font-weight:800;border:none;cursor:pointer;
   font-size:12px;padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.18);color:#fff}
 /* 저장 상태 표시 — save indicator */
 .saving{position:fixed;right:16px;bottom:16px;background:#14372a;color:#fff;font-size:13px;font-weight:700;
   padding:9px 15px;border-radius:10px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:50}
 .saving.on{opacity:.94}
 .saving.err{background:#b91c1c}
</style>
</head>
<body>
<header>
  <div class="lt"><span class="logo">이음이</span><h1 id="hdTitle">담당자(상담) 대시보드</h1></div>
  <div class="rt">
    <a href="서초-이음이-관리자-대시보드.html">관리자(운영) 대시보드 →</a>
    <div class="userbar" id="ub"></div>
  </div>
</header>

<div class="wrap">
  <div class="setbar">
    <span class="material-symbols-outlined" style="color:#15704f">badge</span>
    <b>회원명단 대조</b>
    <span class="rstate" id="rstate">비활성</span>
    <span class="hint">※ 회원명단·대조 on/off는 <b>관리자(운영) 대시보드</b>에서 설정합니다. 여기선 대조 결과만 표시됩니다.</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <footer>(주)플레이포 · 이음이 관리자 대시보드 (프로토타입) · 키오스크 통화 → AI 요약·분류 → 담당자 전달</footer>
</div>

<script src="assets/ieumi-api.js"></script>
<script>
/* ===================================================================
   담당자(상담) 대시보드 — 서버 API 연동
   접수 요청은 키오스크가 서버에 기록하고, 담당자는 그것을 처리합니다.
   Requests are filed by the kiosk and handled here; state is per center and
   shared across devices (PROJECT.md §6-P0), not browser-local.
   =================================================================== */
const esc = IeumiAPI.esc;
const $ = s => document.querySelector(s);

let WHO = null, ROWS = [], filter = 'all', rosterOn = false;

const CATS = {
  job:     ['일자리',    'p-job'],
  health:  ['건강·의료', 'p-health'],
  welfare: ['복지·돌봄', 'p-welfare'],
  urgent:  ['긴급',      'p-urgent'],
  etc:     ['미분류',    'p-etc'],
};
const mask = p => (p ? '010-****-' + String(p).slice(-4) : '');

// ---- 저장 알림 (save toast) ----
const tip = document.createElement('div');
tip.className = 'saving';
document.body.appendChild(tip);
let tipT;
function toast(msg, isErr) {
  tip.textContent = msg;
  tip.classList.toggle('err', !!isErr);
  tip.classList.add('on');
  clearTimeout(tipT);
  tipT = setTimeout(() => tip.classList.remove('on'), isErr ? 4200 : 1400);
}

// 접수 시각 — 오늘이면 시간만, 아니면 날짜까지
function when(iso) {
  const d = new Date(iso), now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? ('오늘 ' + hm) : ((d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + hm);
}

async function load() {
  ROWS = (await IeumiAPI.get('/api/requests')).requests;
  renderAll();
}

function renderStats() {
  const done = ROWS.filter(d => d.status === '완료').length;
  const fu   = ROWS.filter(d => d.followup && d.status !== '완료').length;
  const urg  = ROWS.filter(d => d.urgent && d.status !== '완료').length;
  const sms  = ROWS.filter(d => (d.chips || []).some(c => String(c).includes('발송'))).length;
  $('#stats').innerHTML =
    '<div class="stat"><div class="n">' + ROWS.length + '</div><div class="l">전체 접수</div></div>' +
    '<div class="stat urg"><div class="n">' + urg + '</div><div class="l">긴급 확인</div></div>' +
    '<div class="stat"><div class="n">' + fu + '</div><div class="l">후속연락 필요</div></div>' +
    '<div class="stat"><div class="n">' + sms + '</div><div class="l">문자 발송</div></div>' +
    '<div class="stat"><div class="n">' + done + '</div><div class="l">처리 완료</div></div>';
}

function renderTabs() {
  const cnt = c => (c === 'all' ? ROWS.length : ROWS.filter(d => d.category === c).length);
  const tabs = [['all', '전체'], ['urgent', '긴급'], ['job', '일자리'],
                ['health', '건강·의료'], ['welfare', '복지·돌봄'], ['etc', '미분류']];
  $('#tabs').innerHTML = tabs.map(([k, l]) =>
    '<div class="tab ' + (filter === k ? 'on' : '') + '" data-f="' + k + '">' + l + ' <b>' + cnt(k) + '</b></div>').join('');
}

// 회원명단 대조 배지 — 관리자 대시보드에서 켠 경우에만 표시합니다.
function memBadge(d) {
  if (!rosterOn || !d.caller_phone) return '';
  return d.member_id
    ? '<span class="badge b-mem">✔ 회원확인 ' + esc(d.member_name || '') + '</span>'
    : '<span class="badge b-unreg">⚠ 미등록 번호</span>';
}

function renderList() {
  const rows = ROWS.filter(d => filter === 'all' || d.category === filter);
  $('#list').innerHTML = rows.map(d => {
    const [cl, pc] = CATS[d.category] || CATS.etc;
    const tr = (d.transcript || []).map(t =>
      '<div class="' + (t.role === 'senior' ? 'u' : 'b') + '">' +
      (t.role === 'senior' ? '👵 어르신' : '🧑‍🦳 이음이') + ': ' + esc(t.text) + '</div>').join('');
    const chips = (d.caller_phone ? ['📱 ' + mask(d.caller_phone)] : [])
      .concat(d.service_name ? ['⭐ ' + d.service_name] : [])
      .concat(d.chips || []).map(c => '<span class="chip">' + esc(c) + '</span>').join('');
    const stbtn = ['접수', '처리중', '완료'].map(x =>
      '<button class="' + (d.status === x ? 'on' : '') + '" data-st="' + esc(d.id) + '|' + x + '">' + x + '</button>').join('');

    return '<div class="card c-' + esc(d.category) + (d.status === '완료' ? ' done-c' : '') + '">' +
      '<div class="top">' +
        '<span class="pill ' + pc + '">' + cl + '</span>' +
        (d.urgent ? '<span class="badge b-urg">🚨 긴급</span>' : '') +
        (d.followup ? '<span class="badge b-fu">후속연락</span>' : '') +
        memBadge(d) +
        '<span class="name">' + (esc(d.caller_name) || '익명') + ' 어르신</span>' +
        '<span class="time">' + when(d.created_at) + '</span>' +
      '</div>' +
      '<div class="summary">' + esc(d.summary) + '</div>' +
      '<div class="chips">' + chips + '</div>' +
      (tr ? '<details><summary>💬 대화 원문 보기</summary><div class="tr">' + tr + '</div></details>' : '') +
      '<div class="actions">' +
        '<div class="st">' + stbtn + '</div>' +
        '<label class="fu"><input type="checkbox" data-fu="' + esc(d.id) + '"' + (d.followup ? ' checked' : '') + '/> 후속연락</label>' +
        '<input class="memo" data-memo="' + esc(d.id) + '" placeholder="담당자 메모…" value="' + esc(d.memo || '') + '"/>' +
      '</div></div>';
  }).join('') || '<p style="color:#94a3b8;padding:20px;text-align:center">해당 분류의 접수가 없습니다.</p>';
}

function renderAll() { renderStats(); renderTabs(); renderList(); }

// 서버에 저장 — 실패하면 이전 값으로 되돌립니다.
async function patch(id, body) {
  const row = ROWS.find(r => r.id === id);
  const before = row ? { status: row.status, followup: row.followup, memo: row.memo } : null;
  Object.assign(row || {}, body);
  try {
    await IeumiAPI.patch('/api/requests/' + id, body);
    toast('저장했습니다.');
  } catch (e) {
    if (row && before) Object.assign(row, before);
    renderAll();
    toast(e.message || '저장에 실패했습니다.', true);
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-f]');
  if (t) { filter = t.dataset.f; renderAll(); return; }
  const b = e.target.closest('[data-st]');
  if (b) {
    const [id, status] = b.dataset.st.split('|');
    patch(id, { status }).then(renderAll);
  }
});
document.addEventListener('change', e => {
  const f = e.target.closest('[data-fu]');
  if (f) patch(f.dataset.fu, { followup: f.checked }).then(renderStats);
});

// 메모는 타이핑이 멈춘 뒤에 저장합니다.
const memoT = {};
document.addEventListener('input', e => {
  const m = e.target.closest('[data-memo]'); if (!m) return;
  const id = m.dataset.memo, value = m.value;
  clearTimeout(memoT[id]);
  memoT[id] = setTimeout(() => patch(id, { memo: value }), 700);
});

function syncRoster() {
  const rs = $('#rstate');
  rs.textContent = rosterOn ? '활성' : '비활성';
  rs.classList.toggle('on', rosterOn);
}

async function boot() {
  WHO = await IeumiAPI.guard(['master', 'center_admin', 'staff']);

  // 마스터는 어느 복지관을 보는지 먼저 정해야 합니다.
  let centerName = WHO.center ? WHO.center.name : '';
  if (WHO.user.role === 'master') {
    const list = (await IeumiAPI.get('/api/centers')).centers;
    if (list.length) {
      let cur = IeumiAPI.activeCenter();
      if (!list.some(c => c.id === cur)) { cur = list[0].id; IeumiAPI.setActiveCenter(cur); }
      centerName = (list.find(c => c.id === cur) || {}).name || '';
    }
  }

  IeumiAPI.renderUserBar($('#ub'), WHO);
  $('#hdTitle').textContent = '담당자(상담) 대시보드' + (centerName ? ' · ' + centerName : '');

  try {
    const s = (await IeumiAPI.get('/api/settings')).settings;
    rosterOn = !!s.roster_check_on;
  } catch (e) { rosterOn = false; }
  syncRoster();

  await load();
}

boot().catch(e => {
  if (/unauthenticated|forbidden/.test(e.message)) return;
  console.error(e);
  toast(e.message || '불러오지 못했습니다.', true);
});

</script>
</body>
</html>
