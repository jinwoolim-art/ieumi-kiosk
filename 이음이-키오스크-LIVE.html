<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>이음이</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--brand:#15704f;--green:#59b25f;--line:#3f8fbf;--ink:#183a56}
  body{font-family:'Noto Sans KR',sans-serif;background:#e9eef1;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  .frame{position:relative;width:min(440px,96vw);height:min(94vh,calc(96vw*16/9));aspect-ratio:9/16;
    background:#f4f3f1 url('assets/prototype/배경칼라.png') center/cover no-repeat;border:2px solid #dfe3e6;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -25px rgba(0,0,0,.4)}
  .char{position:absolute;left:-5%;bottom:0;width:74%;height:110%;z-index:2;transform:scale(1.5);transform-origin:bottom center}
  .char img{width:100%;height:100%;object-fit:contain;object-position:bottom center}
  /* 말풍선은 더 이상 글자 수만큼 자라지 않습니다.
     긴 답변이 오면 말풍선이 화면 밖으로 흘러넘쳐, 어르신 그림과 버튼 위를 덮고
     끝 문장은 화면 아래로 잘려 나갔습니다 (클라이언트 화면 사진 참고).
     이제 높이를 정해 두고 그 안에서 굴러갑니다 — 자막이 나오는 대로 아래로
     따라 내려갑니다.
     The bubble used to grow with the text and spill outside the frame, covering
     the character and the buttons, with the last sentences cut off below the
     screen. It is now bounded and scrolls, following the subtitle down. */
  .bubble{position:absolute;top:6%;right:4%;left:43%;z-index:3;background:#fff;border:3px solid var(--line);border-radius:26px;padding:18px 18px;
    display:flex;align-items:center;justify-content:center;text-align:center;font-size:23px;line-height:1.45;font-weight:800;color:var(--ink);word-break:keep-all;white-space:pre-wrap;
    box-shadow:0 14px 30px -18px rgba(63,143,191,.55);transition:opacity .3s;min-height:120px;
    max-height:54%;overflow-y:auto;scrollbar-width:none}
  .bubble::-webkit-scrollbar{display:none}
  /* 길어지면 글씨를 조금 줄입니다 — 그래도 어르신이 읽을 수 있는 크기입니다. */
  .bubble.long{font-size:19px;align-items:flex-start}
  .bubble.hide{opacity:0}
  .call{position:absolute;right:9%;bottom:11%;z-index:4;width:110px;height:110px;cursor:pointer;border:none;background:none;padding:0;border-radius:50%}
  .call img{width:100%;height:100%;display:block;border-radius:50%}
  .call.invite{animation:invite 1.3s ease-in-out infinite}
  @keyframes invite{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .call.listening::before,.call.listening::after{content:"";position:absolute;inset:4px;border-radius:50%;border:3px solid var(--green);animation:ping 1.4s ease-out infinite;pointer-events:none}
  .call.listening::after{animation-delay:.7s}
  @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.65);opacity:0}}
  .status{position:absolute;bottom:27%;left:6%;z-index:6;font-weight:800;font-size:15px;color:var(--brand);background:#eafaf2;border:2px solid var(--green);border-radius:999px;padding:8px 14px;opacity:0;transition:.2s;max-width:55%}
  .status.show{opacity:1}
  .hang{position:absolute;bottom:6%;right:6%;z-index:9;display:none}
  .hang.show{display:block}
  .hang button{font-family:inherit;font-weight:800;font-size:13px;border:none;border-radius:999px;padding:8px 14px;background:#ef4444;color:#fff;cursor:pointer;transition:.2s}
  .hang.alert button{font-size:16px;padding:12px 20px;animation:hangpulse 1.1s infinite}
  @keyframes hangpulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55);transform:scale(1)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0);transform:scale(1.06)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0);transform:scale(1)}}
  /* 입력 대체(타이핑) */
  .typerow{position:absolute;bottom:35%;left:6%;right:6%;z-index:7;display:none;gap:6px}
  .typerow.show{display:none!important}   /* 탐 팀: 채팅 입력창 숨김(음성 전용 키오스크) */
  .typerow input{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:15px}
  .typerow button{border:none;background:var(--brand);color:#fff;font-weight:800;border-radius:12px;padding:0 14px;cursor:pointer}
  /* 키패드 */
  .kwrap{position:absolute;inset:0;z-index:15;background:rgba(21,112,79,.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center}
  .kwrap.hidden{display:none}
  .kp{background:#fff;border-radius:24px;padding:22px;width:88%}
  .kp .t{font-size:19px;font-weight:900;text-align:center;color:var(--brand)}
  .kp .num{font-size:32px;font-weight:900;text-align:center;letter-spacing:2px;min-height:44px;margin-top:6px;color:var(--ink)}
  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .g button{font-family:inherit;font-size:26px;font-weight:900;padding:13px 0;border-radius:14px;border:2px solid #e2e8f0;background:#f8fafc;cursor:pointer}
  .g .del{color:#ef4444;font-size:17px}
  .g .send{grid-column:span 3;background:var(--brand);color:#fff;border-color:var(--brand);font-size:21px}
  .note{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:#aeb9bf;z-index:1}
  .brandwm{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;letter-spacing:.6px;color:#96a2a8;z-index:6;pointer-events:none}
  .off{display:none}
  /* 통화 중 버튼 줄 — status 와 자리가 겹치지 않도록 아래에 따로 둡니다. */
  .actions{position:absolute;bottom:5%;left:6%;width:52%;z-index:10;display:none;flex-direction:column;gap:7px}
  .actions.show{display:none!important}   /* 탐 팀: 다시말씀하기·문자받기 버튼 전부 숨김(초기 버전 UI, 음성 전용) */
  .actions button{font-family:inherit;border:none;border-radius:999px;font-weight:800;cursor:pointer;
    padding:13px 20px;font-size:16px;box-shadow:0 10px 22px -8px rgba(0,0,0,.35)}
  #talkBtn{display:none!important}   /* 탐 팀: 말씀하기 버튼 숨김 — 자동 듣기(버튼 없이 대화) */
  #talkBtn.on{background:#b91c1c;animation:talkpulse 1.2s infinite}
  @keyframes talkpulse{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.5)}50%{box-shadow:0 0 0 12px rgba(185,28,28,0)}}
  #smsBtn{background:#e2e8f0;color:#15704f}
  .cbtns{display:flex;gap:10px;margin-top:16px}
  .cbtns button{flex:1;font-family:inherit;font-size:20px;font-weight:900;padding:16px 0;border-radius:14px;border:none;cursor:pointer}
  .cok{background:var(--brand);color:#fff}.cno{background:#e2e8f0;color:#475569}
  /* 발송 완료 카드 */
  .sentto{text-align:center;font-size:16px;font-weight:800;color:var(--ink);margin-top:10px}
  .sentto b{color:var(--brand)}
  .smsbody{white-space:pre-wrap;background:#f1f8f4;border:2px solid #d6ece0;border-radius:14px;padding:15px 16px;margin-top:13px;font-size:15px;line-height:1.6;color:#1f2937;text-align:left}
  .doneBtn{width:100%;margin-top:15px;font-family:inherit;font-size:20px;font-weight:900;padding:15px 0;border-radius:14px;border:none;background:var(--brand);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="frame">
  <div class="char"><img src="assets/prototype/이음이프린트티.png" alt="이음이"/></div>
  <div class="bubble" id="bubble">저는 이음이예요 😊<br/>날씨·일자리·복지 무엇이든<br/>편하게 물어보세요.<br/>수화기를 들고 초록 버튼을 눌러 주세요.</div>
  <div class="status" id="status"></div>

  <button class="call invite" id="call"><img src="assets/prototype/전화아이콘.png" alt="통화"/></button>
  <div class="hang" id="hang"><button id="hangBtn">통화 종료</button></div>

  <!-- 통화 중 어르신이 누를 수 있는 버튼들.
       '문자 받기'는 예전에 status 와 같은 자리에 있었고, 보이게 만드는 코드가
       한 줄도 없어서 실제로는 누를 수 없었습니다 — 이음이는 "문자 받기를 누르세요"
       라고 말하는데 화면에는 그 버튼이 없었습니다. -->
  <div class="actions" id="actions">
    <button id="talkBtn">🎤 다시 말씀하기</button>
    <button id="smsBtn">📩 문자 받기</button>
  </div>

  <div class="typerow" id="typerow">
    <input id="typein" placeholder="말이 안 되면 여기에 입력…"/>
    <button id="typebtn">보내기</button>
  </div>

  <div class="kwrap hidden" id="kwrap">
    <div class="kp" id="kpEntry">
      <div class="t" id="ktitle">전화번호를 눌러 주세요</div>
      <div class="num" id="num">​</div>
      <div class="g">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button class="del" data-act="del">지우기</button><button>0</button><button class="del" data-act="del">←</button>
        <button class="send" data-act="send">문자 보내기</button>
      </div>
    </div>
    <div class="kp off" id="kpConfirm">
      <div class="t" id="ctitle">이 번호로 문자를 보내드릴까요?</div>
      <div class="num" id="cnum" style="color:#15704f">​</div>
      <div class="cbtns">
        <button class="cok" data-act="cyes">예, 보내주세요</button>
        <button class="cno" data-act="cno">아니요, 다시</button>
      </div>
    </div>
    <div class="kp off" id="kpSent">
      <div class="t" id="sentTitle">✅ 문자를 보냈어요</div>
      <div class="sentto" id="sentTo"></div>
      <div class="smsbody" id="smsBody"></div>
      <button class="doneBtn" data-act="sdone">확인</button>
    </div>
  </div>
  <div class="brandwm">play4.co.kr</div>
  <div class="note">※ 마이크 권한 허용 필요. 버튼을 누르지 않고 그냥 말씀하시면 됩니다.</div>
</div>

<script>
const $=s=>document.querySelector(s);
const bubble=$('#bubble'), statusEl=$('#status'), call=$('#call'), hang=$('#hang'),
      typerow=$('#typerow'), kwrap=$('#kwrap'), num=$('#num'),
      smsBtn=$('#smsBtn'), talkBtn=$('#talkBtn'), actions=$('#actions'), kpEntry=$('#kpEntry'), kpConfirm=$('#kpConfirm'), cnum=$('#cnum'), ctitle=$('#ctitle'),
      kpSent=$('#kpSent'), sentTitle=$('#sentTitle'), sentTo=$('#sentTo'), smsBody=$('#smsBody');
const API=''; // 같은 오리진(localhost:8791)
const KO={'0':'공','1':'일','2':'이','3':'삼','4':'사','5':'오','6':'육','7':'칠','8':'팔','9':'구'};
const digitsKo=p=>[p.slice(0,3),p.slice(3,7),p.slice(7,11)].filter(Boolean).map(s=>s.split('').map(d=>KO[d]||d).join('')).join(', ');

// ---- 복지관 식별 (멀티테넌트) ----
// 키오스크는 로그인하는 사람이 없으므로, 주소의 ?c= 토큰으로 자기 복지관을 알립니다.
// 관리자 대시보드 → 이음이 설정에서 이 주소를 확인할 수 있습니다.
// A kiosk has no one to sign in, so it identifies its center with the ?c= token
// in its URL (PROJECT.md §3-1). The admin dashboard shows the address to use.
const CTOKEN=new URLSearchParams(location.search).get('c')||'';
let CTX={ center:null, settings:{}, services:[] };   // 서버에서 받아온 복지관 설정

async function loadContext(){
  if(!CTOKEN) return;                        // 토큰 없이 열면 기본값으로 동작(시연용)
  try{
    const r=await fetch(API+'/api/kiosk/context?c='+encodeURIComponent(CTOKEN));
    if(r.ok) CTX=await r.json();
  }catch(e){}
}
const centerName=()=>(CTX.center&&CTX.center.name)||'서초 어르신 행복이음';
const ieumiName =()=>(CTX.settings&&CTX.settings.ieumi_name)||'이음이';

// 회원명단 대조 — 서버의 복지관 명단에 물어봅니다 (브라우저에 명단을 두지 않습니다).
let memberInfo=null;                          // { found, name } — 번호 확인 시 채워집니다
const memberName=()=>(memberInfo&&memberInfo.found?memberInfo.name:'');
async function lookupMember(p){
  memberInfo=null;
  if(!CTOKEN||!(CTX.settings&&CTX.settings.roster_check_on)) return;
  try{
    const r=await fetch(API+'/api/kiosk/lookup',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({c:CTOKEN, phone:p})});
    if(r.ok) memberInfo=await r.json();
  }catch(e){}
}

// 일자리 목록은 서버가 이 복지관 지역으로 직접 찾아서 돌려줍니다.
//
// 여기에 하드코딩된 시연용 2건이 있었습니다 — "월급 150만원", "시급 만 삼백이십 원".
// The server builds the prompt from real postings, so `pick` was an index into
// *its* list; resolving it against a hardcoded array here meant a senior who
// asked about a real posting was shown, and texted, a different invented one —
// with a wage the source has no field for (PROJECT.md §11). The server resolves
// the index now and sends back the posting it actually used.
let JOBS=[];
let history=[], active=false, offerSms=false, pickedJob=null, awaitingFollowup=false;
let lastSummary='', lastCategory='', smsSent=false;
let lastServiceCode='', lastServiceName='';   // 이음이가 짚어낸 서비스 (§6-P1)

// Claude가 돌려주는 한국어 분류를 담당자 대시보드의 분류로 옮깁니다.
const CATMAP={'일자리':'job','건강':'health','복지':'welfare','긴급':'urgent','일상':'etc','행정':'etc','기타':'etc'};

// 통화가 끝나면 접수 요청으로 서버에 남깁니다 → 담당자 대시보드에서 처리 (§6-P2).
async function fileRequest(){
  if(!CTOKEN || history.length<2) return;
  const chips=[];
  if(lastServiceName) chips.push('서비스: '+lastServiceName);
  if(pickedJob) chips.push('관심: '+pickedJob.job);
  if(smsSent)   chips.push('문자 발송됨');
  const body={
    c:CTOKEN,
    phone,
    name:memberName(),
    category:CATMAP[lastCategory]||'etc',
    serviceCode:lastServiceCode,
    summary:lastSummary||(history.find(m=>m.role==='user')||{}).content||'',
    urgent:lastCategory==='긴급',
    followup:!smsSent,
    chips,
    transcript:history.map(m=>({role:m.role==='user'?'senior':'ieumi', text:m.content})),
  };
  try{
    await fetch(API+'/api/kiosk/requests',{method:'POST',
      headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
  }catch(e){}
}

const setStatus=(t,on=true)=>{statusEl.textContent=t;statusEl.classList.toggle('show',on&&!!t);};

// ---- 자막 ----
// 이음이가 말하는 속도에 맞춰 글이 나옵니다 (클라이언트 요청).
//
// 예전에는 Claude 가 글자를 보내는 대로 말풍선에 다 썼습니다. 글은 몇 백 밀리초
// 만에 끝까지 나오는데 목소리는 그제야 첫 문장을 읽고 있으니, 화면과 소리가
// 따로 놀았습니다. 어르신은 이미 다 적힌 긴 글을 보며 소리를 기다리셨습니다.
//
// 이제 글은 <그 문장을 읽는 소리가 재생되는 동안> 그 길이에 맞춰 나옵니다.
// 소리의 재생 위치(currentTime/duration)를 그대로 따라가므로, 말이 느리면 글도
// 느리게, 빠르면 빠르게 나옵니다.
//
// The text used to be painted as Claude streamed it — the whole answer landed in
// a few hundred milliseconds while the voice was still on the first sentence.
// Now each sentence is revealed in step with the clip that speaks it, driven by
// the audio element's own playback position, so the two can never drift.
let subtitleDone='';        // 이미 다 읽은 문장들 — 화면에 그대로 남습니다
let subtitlePending=false;  // 다음 소리가 나올 때 화면을 갈아 끼웁니다
function subtitleShow(text){
  bubble.textContent=text;
  bubble.classList.remove('hide');
  bubble.classList.toggle('long', text.length>120);
  bubble.scrollTop=bubble.scrollHeight;   // 새로 나온 글이 늘 보이게
}
// 새 답변이 시작되지만, <아직 지우지는 않습니다.>
//
// 이음이가 생각하는 몇 초 동안 말풍선을 비워 두면 화면이 멍하니 빕니다. 그래서
// 앞 답변을 그대로 두었다가, 새 목소리가 실제로 나오는 순간에 갈아 끼웁니다.
function subtitleNewTurn(){ subtitlePending=true; }
// 문장과 문장 사이는 한 칸 띄웁니다.
// 합성에 넘기면서 문장마다 앞뒤 공백을 떼기 때문에, 그냥 이어 붙이면
// "어르신.무엇을" 처럼 붙어 버립니다 — 읽기 좋으라고 고친 자막에서 그러면
// 고친 보람이 없습니다.
function spaced(prev){ return prev && !/\s$/.test(prev) ? prev + ' ' : prev; }
function subtitleTakeTurn(){ if(subtitlePending){ subtitlePending=false; subtitleDone=''; } }
function subtitleReset(){ subtitleDone=''; subtitlePending=false; bubble.textContent=''; bubble.classList.remove('long'); }

// 정적인 화면 문구(대기 화면 등)는 예전처럼 한 번에 씁니다 — 읽어 줄 소리가 없습니다.
const say=(t)=>{subtitleDone='';bubble.innerHTML=t;bubble.classList.toggle('long',(bubble.textContent||'').length>120);bubble.classList.remove('hide');};

// ---- 음성 인식 (클로바) — 누르지 않고 그냥 말씀하시면 됩니다 ----
//
// 어르신들이 버튼 누르고 말하는 것을 불편해하십니다 (클라이언트 요청). 그래서
// 이음이가 말을 마치면 마이크가 저절로 열립니다. 어르신은 그냥 말씀하시면 됩니다.
//
// <그런데 예전에 자동으로 열었을 때 무한 반복이 났습니다.> 마이크가 주변 소음과
// 이음이 자신의 목소리를 말로 알아듣고, 그것이 다시 질문이 되어 → 또 답하고 →
// 또 열리는 고리였습니다. 그래서 이번에는 세 가지를 막아 두었습니다:
//   ① 이음이가 말하는 동안에는 마이크를 아예 연결하지 않습니다 (재생이 다 끝나고
//      0.3초 뒤에 엽니다). 자기 목소리가 들어올 구멍 자체가 없습니다.
//   ② 소리 크기를 재서, <말이 시작된 뒤에> 조용해질 때만 끊어 보냅니다.
//      말이 한 번도 없었으면 아무것도 보내지 않습니다 — 조용한 방에서 혼자
//      말을 만들어 내던 것이 바로 그 고리의 시작이었습니다.
//   ③ 브라우저의 에코 제거·소음 억제를 켭니다.
//
// 인식은 브라우저 내장 기능이 아니라 <클로바>가 합니다. 브라우저 인식은 어르신
// 말씀을 자주 놓쳤습니다. 보내는 소리는 16kHz 모노 WAV 입니다 — MediaRecorder 가
// 만드는 webm/opus 는 클로바가 받지 않기 때문에, 여기서 직접 만듭니다.
//
// Listening is automatic again, which is what the client asked for — seniors
// find press-to-talk awkward. The loop that made press-to-talk necessary is
// prevented at the source instead: the microphone is not connected at all while
// Ieumi is speaking, and a recording is only sent if speech was actually heard.
// Recognition is CLOVA rather than the browser's, which missed a great deal of
// what seniors said. CLOVA will not accept MediaRecorder's webm/opus, so raw PCM
// is captured and wrapped as 16 kHz mono WAV here.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let sttMode='clova';        // 클로바가 안 되면 브라우저 인식으로 내려앉습니다
let rec=null, listening=false;

const MIC={
  rate:16000,
  ctx:null, stream:null, src:null, node:null,
  chunks:[], heardSpeech:false, floor:0, frames:0, silence:0, speechMs:0, started:0,
  stopping:false,
};
// 말이 끝나고 얼마나 기다렸다가 보낼 것인가 — 매 턴 그대로 침묵이 됩니다.
//
// 1.3초를 한결같이 기다렸습니다. 그런데 한 문장을 다 말씀하신 어르신은 이미
// 끝내신 것이고, 그 1.3초는 고스란히 "왜 대답이 없지" 하는 시간이 됩니다.
// 반대로 "어..." 하고 멈추신 분께는 1.3초도 짧습니다 — 말을 자르는 셈입니다.
// 그래서 <얼마나 말씀하셨는지>로 나눕니다. 충분히 말씀하셨으면 0.9초에 보내고,
// 아직 한두 마디뿐이면 1.5초까지 기다립니다. 흔한 경우는 0.4초 빨라지고,
// 망설이시는 경우는 오히려 더 너그러워집니다.
//
// A flat 1.3s was silence the senior heard on every single turn. Someone who has
// finished a whole sentence is done, and that wait is dead air; someone who has
// managed two syllables is still thinking, and 1.3s cuts them off. Splitting on
// how much they have actually said makes the common case 0.4s faster and the
// hesitant case more patient than before.
const SPOKE_ENOUGH_MS=1200;  // 이만큼 말씀하셨으면 한 생각을 마치신 것으로 봅니다
const SILENCE_MS=900;        // 그때는 이만큼만 조용하면 보냅니다
const SILENCE_HESITANT_MS=1500;  // 아직 짧게만 말씀하셨으면 조금 더 기다립니다
const NO_SPEECH_MS=12000;   // 한 마디도 없으면 그냥 닫습니다 (보내지 않습니다)
const MAX_MS=20000;         // 클로바 단문 인식 한도 안에서 끊습니다
// 헛도는 것을 막는 두 개의 눈금. 어르신이 실제로 말씀하신 것이 한 번 들어오면
// 둘 다 0 으로 돌아갑니다 (onUser).
let quietRounds=0;          // 아무 소리도 없이 닫힌 횟수
let emptyRounds=0;          // 소리는 났는데 말이 아니었던 횟수

function paintTalk(){
  talkBtn.textContent = listening ? '🔴 듣고 있어요 (다 하시면 눌러 주세요)' : '🎤 다시 말씀하기';
  talkBtn.classList.toggle('on', listening);
  call.classList.toggle('listening', listening);
}

// 소리 → WAV. 클로바가 받는 형식입니다.
function wavFromPcm(chunks, rate){
  let len=0; for(const c of chunks) len+=c.length;
  const buf=new ArrayBuffer(44+len*2), v=new DataView(buf);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+len*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,len*2,true);
  let o=44;
  for(const c of chunks) for(let i=0;i<c.length;i++,o+=2){
    const s=Math.max(-1,Math.min(1,c[i]));
    v.setInt16(o, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([buf],{type:'audio/wav'});
}

// 마이크는 통화 한 번에 한 번만 엽니다 — 매번 열면 그때마다 반 초가 날아갑니다.
async function micReady(){
  if(MIC.stream) return true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try{
    MIC.stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true, autoGainControl:true,
    }});
    const AC=window.AudioContext||window.webkitAudioContext;
    // 16kHz 로 직접 받습니다 — 브라우저가 알아서 변환해 주므로 여기서 다시
    // 샘플을 솎아낼 필요가 없습니다.
    try{ MIC.ctx=new AC({sampleRate:MIC.rate}); }catch(e){ MIC.ctx=new AC(); }
    MIC.rate=MIC.ctx.sampleRate;
    MIC.src=MIC.ctx.createMediaStreamSource(MIC.stream);
    // ScriptProcessorNode 는 오래된 방식이지만, 원본 PCM 을 얻는 가장 확실한
    // 길입니다. AudioWorklet 은 별도 파일이 필요해서 이 한 장짜리 화면에는
    // 맞지 않습니다. 키오스크는 크롬에서 돕니다.
    MIC.node=MIC.ctx.createScriptProcessor(2048,1,1);
    MIC.node.onaudioprocess=(e)=>{
      // 이 마디를 스피커로 내보내지 않습니다.
      // ScriptProcessorNode 는 스피커에 이어 놓아야 동작하는데, 출력 버퍼를
      // 그대로 두면 브라우저에 따라 마이크 소리가 스피커로 되돌아 나갈 수
      // 있습니다 — 키오스크가 자기 소리를 다시 듣는, 바로 그 고리입니다.
      const outb=e.outputBuffer.getChannelData(0);
      outb.fill(0);
      if(!listening) return;                       // 듣는 중이 아닐 때는 버립니다
      const inb=e.inputBuffer.getChannelData(0);
      MIC.chunks.push(new Float32Array(inb));
      let sum=0; for(let i=0;i<inb.length;i++) sum+=inb[i]*inb[i];
      const rms=Math.sqrt(sum/inb.length);
      const frameMs=(inb.length/MIC.rate)*1000;
      MIC.frames++;
      // 처음 여섯 조각(약 0.8초)으로 이 방이 얼마나 시끄러운지 잽니다.
      // 경로당은 조용한 사무실이 아닙니다 — 고정된 기준값을 쓰면 시끄러운 날엔
      // 늘 말하는 중으로, 조용한 날엔 늘 침묵으로 잘못 읽습니다.
      if(MIC.frames<=6){ MIC.floor=Math.max(MIC.floor,rms); return; }
      const gate=Math.max(MIC.floor*2.2, 0.012);
      if(rms>gate){ MIC.heardSpeech=true; MIC.silence=0; MIC.speechMs+=frameMs; }
      else if(MIC.heardSpeech){ MIC.silence+=frameMs; }
      const elapsed=Date.now()-MIC.started;
      const waitMs=MIC.speechMs>=SPOKE_ENOUGH_MS ? SILENCE_MS : SILENCE_HESITANT_MS;
      if(MIC.heardSpeech && MIC.silence>=waitMs) finishListening(true);
      else if(!MIC.heardSpeech && elapsed>NO_SPEECH_MS) finishListening(false);
      else if(elapsed>MAX_MS) finishListening(MIC.heardSpeech);
    };
    return true;
  }catch(e){ MIC.stream=null; return false; }
}

async function startListening(){
  if(!active || listening) return;
  if(sttMode==='browser') return startBrowserListening();
  const ok=await micReady();
  if(!ok){
    // 마이크가 없거나 권한이 거부됨 — 브라우저 인식도 못 씁니다. 타이핑으로.
    typerow.classList.add('show'); setStatus('말씀하기 버튼을 눌러 주세요'); return;
  }
  MIC.chunks=[]; MIC.heardSpeech=false; MIC.floor=0; MIC.frames=0; MIC.silence=0; MIC.speechMs=0;
  MIC.started=Date.now(); MIC.stopping=false;
  try{ if(MIC.ctx.state==='suspended') await MIC.ctx.resume(); }catch(e){}
  MIC.src.connect(MIC.node); MIC.node.connect(MIC.ctx.destination);
  listening=true; paintTalk();
  setStatus('말씀하세요 🎙️');
}

// 마이크를 닫고, 말이 있었으면 클로바로 보냅니다.
async function finishListening(send){
  if(!listening || MIC.stopping) return;
  MIC.stopping=true;
  listening=false; paintTalk();
  try{ MIC.src.disconnect(MIC.node); MIC.node.disconnect(); }catch(e){}
  const chunks=MIC.chunks; MIC.chunks=[];
  if(!send || !chunks.length){
    // 한 마디도 없었습니다. 아무것도 보내지 않습니다 — 조용한 방을 말로
    // 알아듣고 스스로 대화를 이어가던 것이 예전의 그 무한 반복이었습니다.
    //
    // 다만 한 번은 더 열어 드립니다. 어르신은 생각하시는 데 시간이 걸리고,
    // 12초는 짧습니다. 그래도 아무 말씀이 없으면 화면으로 여쭙니다.
    if(!active) return;
    if(quietRounds<1){ quietRounds++; return startListening(); }
    setStatus('');   /* 탐 팀: 안내 문구 없이 조용히 대기 */
    return;
  }
  setStatus('알아듣는 중…');
  try{
    const wav=wavFromPcm(chunks, MIC.rate);
    const r=await fetch(API+'/stt?lang='+LANG(),{method:'POST',
      headers:{'content-type':'application/octet-stream'}, body:wav});
    const d=await r.json().catch(()=>({}));
    const t=(d.text||'').trim();
    if(d.error && SR){
      // 클로바가 막혀 있으면(키 미설정·미승인) 브라우저 인식으로 내려앉습니다.
      // 어르신께는 아무 말도 하지 않습니다 — 그냥 계속 듣습니다.
      sttMode='browser'; setStatus(''); return startBrowserListening();
    }
    if(!t){
      // 소리는 났는데 말이 아니었습니다(기침·문 닫는 소리·옆자리 대화).
      // 두 번까지만 다시 듣습니다 — 시끄러운 방에서 끝없이 되풀이하면
      // 어르신은 가만히 서 계시는데 기계만 혼자 바쁩니다.
      if(!active) return;
      setStatus('잘 못 들었어요. 한 번만 더 말씀해 주세요.');
      if(emptyRounds<2){ emptyRounds++; return startListening(); }
      typerow.classList.add('show');
      return;
    }
    setStatus('');
    onUser(t);
  }catch(e){
    if(active){ setStatus('잘 못 들었어요. 한 번만 더 말씀해 주세요.'); typerow.classList.add('show'); }
  }
}

// 어르신이 "다 말했어요" 하고 버튼을 누르셨을 때 — 지금까지 들은 것을 보냅니다.
function stopListening(){
  if(listening && sttMode==='clova'){ finishListening(MIC.heardSpeech); return; }
  if(rec && listening){ try{ rec.stop(); }catch(e){} }
  listening=false; paintTalk();
}

/**
 * 듣던 것을 그냥 버립니다 — 보내지 않습니다.
 *
 * 어르신이 말씀 대신 타이핑을 하시거나 키패드를 여셨을 때 씁니다. 이때 녹음된
 * 것을 인식에 보내면, 어르신이 이미 다른 방법으로 말씀하셨는데 그 소리가 뒤늦게
 * 또 하나의 질문이 되어 들어옵니다 — 예전 무한 반복과 같은 모양입니다.
 */
function abortListening(){
  if(!listening) return;
  listening=false; MIC.stopping=true; MIC.chunks=[];
  try{ MIC.src && MIC.src.disconnect(MIC.node); MIC.node && MIC.node.disconnect(); }catch(e){}
  if(rec){ try{ rec.stop(); }catch(e){} }
  paintTalk();
}

// ---- 예비책: 브라우저 내장 인식 ----
// 클로바가 막혀 있을 때만 씁니다. 인식률은 낮지만, 아무 말도 못 알아듣는 것보다는
// 낫습니다. 여기서도 마이크는 이음이가 말을 마친 뒤에만 열립니다.
if(SR){ rec=new SR(); rec.lang='ko-KR'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=e=>{
    const r=e.results[0][0];
    const t=(r.transcript||'').trim();
    // 소음 거르기. 글자 수로 자르지는 않습니다 — 한국어에서 "네", "예"는
    // 한 글자짜리 정상 대답이라, 짧다고 버리면 진짜 대답을 버리게 됩니다.
    const conf = typeof r.confidence==='number' ? r.confidence : 0;
    if(!t || (conf>0 && conf<0.3)){
      if(active) setStatus('잘 못 들었어요. 한 번만 더 말씀해 주세요.');
      return;
    }
    onUser(t);
  };
  rec.onerror=()=>{ listening=false; paintTalk();
    if(active){ setStatus('말이 안 들려요. 말씀하기 버튼을 눌러 주세요.'); typerow.classList.add('show'); } };
  rec.onend=()=>{ listening=false; paintTalk(); };
}
function startBrowserListening(){
  if(!active || listening) return;
  if(!rec){ typerow.classList.add('show'); setStatus('말씀하기 버튼을 눌러 주세요'); return; }
  try{ rec.start(); listening=true; setStatus('말씀하세요 🎙️'); }
  catch(e){ listening=false; }
  paintTalk();
}

// 마이크를 완전히 놓아 줍니다 — 통화가 끝나면 녹음 표시가 남아 있으면 안 됩니다.
function micRelease(){
  try{ MIC.src && MIC.node && MIC.src.disconnect(MIC.node); MIC.node && MIC.node.disconnect(); }catch(e){}
  try{ MIC.stream && MIC.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ MIC.ctx && MIC.ctx.close(); }catch(e){}
  MIC.stream=null; MIC.ctx=null; MIC.src=null; MIC.node=null; MIC.chunks=[];
}

// 무응답(침묵) 감지 → 통화 종료 버튼 강조 + 안내
let idleTimer=null;
function clearIdle(){ if(idleTimer){clearTimeout(idleTimer);idleTimer=null;} hang.classList.remove('alert'); }
function armIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>{
  if(!active || listening) return;
  hang.classList.add('alert');   /* 탐 팀: 무응답 시 안내 문구 없이 종료 버튼만 살짝 강조 */
}, 25000); }
/**
 * 어르신 차례 — Ieumi has finished speaking, so the microphone opens by itself.
 *
 * 이음이가 말을 다 끝낸 <뒤에> 열립니다. 재생이 끝나고 0.3초를 두는 것은, 스피커의
 * 마지막 울림이 마이크로 들어가 그것이 다시 질문이 되는 일을 막기 위해서입니다.
 */
function readyForUser(){
  if(!active) return;
  actions.classList.add('show');
  armIdle();
  setTimeout(()=>{ if(active && !listening && kwrap.classList.contains('hidden')) startListening(); }, 300);
}

// ---- 음성 출력 (스트리밍 파이프라인) ----
// 어르신이 기다리는 시간을 줄이는 핵심입니다 (§3-6 ①②).
//
// 예전에는 답을 끝까지 받아 → 통째로 음성 합성 → 재생이라, 첫 소리까지 8초쯤
// 걸렸습니다. 이제는 문장이 하나 완성될 때마다 바로 합성을 시작하고, 합성은
// 여러 개가 동시에 진행되며, 재생만 순서대로 합니다.
//
// The old path waited for the whole answer, then synthesised all of it, then
// played — about eight seconds before any sound. Now each finished sentence is
// sent for synthesis the moment it exists; requests overlap, playback stays in
// order. CLOVA costs ~1.8s per call regardless of length, so only the first
// short sentence is ever waited on.
let audio = new Audio();
let speechQueue = [];        // {promise, resolve} — synthesis in flight, played in order
let draining = false;
let speechEpoch = 0;         // bumped on hang-up so late audio from a finished call is dropped

function stripForSpeech(t){
  return (t||'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'')
    .replace(/\s{2,}/g,' ')
    .trim();
}

function ttsBlob(text){
  return fetch(API+'/tts',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({text, c:CTOKEN})}).then(r=>r.blob());
}

// 문장 하나를 재생 대기열에 넣습니다. 합성은 지금 바로 시작합니다.
// 자막으로 보여 줄 글도 <같은 문장>을 들고 갑니다 — 소리와 글이 한 짝입니다.
function enqueueSpeech(text){
  const clean = stripForSpeech(text);
  if(!clean) return Promise.resolve();
  const epoch = speechEpoch;
  let done;
  const finished = new Promise(r=>{ done = r; });
  speechQueue.push({ blob: ttsBlob(clean).catch(()=>null), done, epoch, text: clean });
  drainSpeech();
  return finished;
}

/**
 * 한 문장을 재생하면서, 그 소리에 맞춰 자막을 내보냅니다.
 *
 * 글자가 나오는 속도를 짐작해서 정하지 않습니다 — 지금 재생되고 있는 위치
 * (currentTime / duration)를 그대로 씁니다. 그래서 복지관이 목소리 속도를
 * 느리게 바꿔도(어르신용 설정), 자막이 알아서 같이 느려집니다.
 *
 * The reveal is not a guessed typing speed: it is the clip's own playback
 * position. A centre that slows the voice down for its seniors gets slower
 * subtitles for free, and the two cannot drift apart.
 *
 * 화면을 그리는 타이밍(requestAnimationFrame)이 아니라 <타이머>로 돕니다.
 * 처음에는 requestAnimationFrame 을 썼는데, 브라우저가 화면을 안 그리는 상태
 * (창이 뒤에 있거나 화면이 꺼졌을 때)에서는 한 번도 불리지 않아, 소리는 나는데
 * 말풍선은 텅 빈 채로 있다가 문장이 끝나서야 한꺼번에 채워졌습니다. 실제로
 * 그렇게 되는 것을 확인했습니다. 타이머는 그런 상태에서도 돕니다.
 *
 * Driven by a timer, not requestAnimationFrame: rAF does not fire at all while
 * the page is not being painted — measured, zero callbacks — which left the
 * voice playing against an empty bubble until the sentence ended. A kiosk whose
 * browser is behind something else must still show its subtitles.
 */
const REVEAL_MS = 80;    // 0.08초마다 — 눈으로는 이어져 보이고, 일은 거의 없습니다

function playAndReveal(blob, text){
  return new Promise(res=>{
    const before = spaced(subtitleDone);   // 이 문장 앞까지 이미 읽은 글 (+ 사이 한 칸)
    const url = URL.createObjectURL(blob);
    let timer = 0, settled = false;
    const finish = ()=>{
      if(settled) return; settled = true;
      clearInterval(timer);
      subtitleDone = before + text;       // 다 읽은 문장은 화면에 그대로 남습니다
      subtitleShow(subtitleDone);
      try{ URL.revokeObjectURL(url); }catch(e){}
      res();
    };
    const tick = ()=>{
      const d = audio.duration;
      const frac = (d && isFinite(d) && d>0) ? Math.min(1, audio.currentTime/d) : 0;
      subtitleShow(before + text.slice(0, Math.ceil(text.length*frac)));
    };
    audio.src = url;
    audio.onended = finish; audio.onerror = finish;
    const start = ()=>{ tick(); timer = setInterval(tick, REVEAL_MS); };
    const p = audio.play();
    if(p && p.then) p.then(start).catch(finish);
    else start();
  });
}

async function drainSpeech(){
  if(draining) return;
  draining = true;
  while(speechQueue.length){
    const item = speechQueue.shift();
    try{
      const blob = await item.blob;
      if(item.epoch === speechEpoch){
        setStatus('이음이가 답변하는 중…', true);
        call.classList.remove('listening');
        subtitleTakeTurn();      // 새 답변의 첫 소리 — 이때 화면을 갈아 끼웁니다
        if(blob){
          await playAndReveal(blob, item.text);
        }else{
          // 소리가 안 나올 때는(합성 실패) 글만이라도 바로 보여 드립니다.
          // 맞출 소리가 없는데 천천히 내보내면 그냥 느린 화면일 뿐입니다.
          subtitleDone = spaced(subtitleDone) + item.text;
          subtitleShow(subtitleDone);
        }
      }
    }catch(e){}
    item.done();
  }
  draining = false;
}

// 통화가 끝나면 아직 재생되지 않은 소리는 버립니다.
function stopSpeech(){
  speechEpoch++;
  speechQueue.forEach(i=>i.done());
  speechQueue = [];
  try{ audio.pause(); }catch(e){}
}

// 한 덩어리를 말하고 끝날 때까지 기다립니다 (인사말·확인 등 단발 발화용).
// 자막도 이 안에서 나옵니다 — 부르는 쪽에서 따로 화면에 쓰지 않습니다.
// 예전에는 say(m) 으로 먼저 다 써 놓고 speak(m) 으로 읽었기 때문에, 글이 늘
// 소리보다 한 발 앞서 있었습니다.
const speak = (text) => { subtitleNewTurn(); return enqueueSpeech(text); };

// 스트리밍으로 들어오는 글을 문장 단위로 잘라 차례차례 합성에 넘깁니다.
// 문장이 끝나야 자연스러운 억양이 나오므로, 완성된 문장만 보냅니다.
function makeSentencePump(){
  let pending = '';
  return {
    push(chunk){
      pending += chunk;
      let m;
      // 종결부호까지 포함해 한 문장씩 떼어냅니다.
      while((m = pending.match(/^[\s\S]*?[.!?…。]["')\]]*\s*/))){
        const sentence = m[0];
        pending = pending.slice(sentence.length);
        enqueueSpeech(sentence);
      }
      // 종결부호 없이 너무 길어지면(모델이 문장을 안 끊는 경우) 쉼표에서 끊습니다.
      if(pending.length > 60){
        const cut = pending.lastIndexOf(', ');
        if(cut > 20){ enqueueSpeech(pending.slice(0, cut+1)); pending = pending.slice(cut+1); }
      }
    },
    flush(){
      const rest = pending.trim();
      pending = '';
      if(rest) return enqueueSpeech(rest);
      return Promise.resolve();
    },
  };
}

// 즉답 추임새 — 답이 만들어지기까지의 침묵을 메웁니다 (탐 팀).
// 어르신 질문의 갈래에 맞춰 "네, 날씨 확인해 볼게요"처럼 짧게 먼저 대답합니다.
// 이 소리가 재생되는 동안 뒤에서 진짜 답이 준비됩니다 — enqueueSpeech 큐에 먼저
// 들어가므로 자연히 본 답변보다 앞서 재생됩니다.
function fillerText(){
  const q = history.length ? String(history[history.length-1].content || '') : '';
  if(/날씨|더워|더운|추워|추운|기온|온도|비가|눈이|우산/.test(q)) return '네, 날씨 확인해 볼게요.';
  if(/일자리|일거리|채용|구인|일\s?있|알바|근로/.test(q)) return '네, 일자리 한번 찾아볼게요.';
  if(/병원|약국|진료|아파|아프|치료|의원|보건소/.test(q)) return '네, 알아볼게요.';
  if(/복지|지원|급여|수급|보조금|얼마|비용|신청/.test(q)) return '네, 확인해 볼게요.';
  return '네, 잠시만요.';
}

// ---- 대화 한 턴 (스트리밍) ----
// 답이 다 나올 때까지 기다리지 않습니다. 문장이 하나 끝나는 대로 음성 합성을
// 시작하고, 자막은 그 소리에 맞춰 나옵니다 (§3-6 ①②).
async function botTurn(){
  subtitleNewTurn();
  setStatus('이음이가 생각하는 중…');
  enqueueSpeech(fillerText());   // 탐 팀: 즉답 추임새 — 대기 침묵을 먼저 메웁니다
  const pump = makeSentencePump();
  let reply = '', meta = null, failed = '';

  try{
    const r = await fetch(API+'/chat',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({history, c:CTOKEN, stream:true, lang:LANG()})});

    if(!r.ok || !r.body) throw new Error('stream unavailable');

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      let nl;
      while((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0,nl).trim();
        buf = buf.slice(nl+1);
        if(!line) continue;
        let ev; try{ ev = JSON.parse(line); }catch(e){ continue; }

        if(typeof ev.t === 'string'){
          reply += ev.t;
          // 여기서 화면에 쓰지 않습니다. 글은 그 문장을 읽는 소리와 함께 나옵니다
          // (playAndReveal). 예전에는 이 자리에서 답을 통째로 써 버렸고, 그래서
          // 화면은 이미 다 끝났는데 목소리는 첫 문장을 읽고 있었습니다.
          pump.push(ev.t);   // 문장이 끝나면 그 자리에서 합성 시작
        }
        if(ev.done){
          if(ev.error) failed = ev.error;
          meta = ev;
        }
      }
    }
  }catch(e){
    // 스트리밍이 막힌 환경(프록시 등)에서는 예전 방식으로 한 번 더 시도합니다.
    try{
      const r = await fetch(API+'/chat',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({history, c:CTOKEN, lang:LANG()})});
      const d = await r.json();
      if(d.error) throw new Error(d.error);
      meta = d;
      reply = (d.parsed && d.parsed.reply) || d.raw || '';
      pump.push(reply);
    }catch(e2){
      stopSpeech();
      say('연결에 문제가 있어요. 잠시 후 다시 해주세요.');
      setStatus('');
      return;
    }
  }

  if(failed || !reply.trim()){
    if(failed) setStatus('⚠ '+String(failed).slice(0,70), true);
    await speak('죄송해요, 지금은 대답하기 어려워요.');
    if(active) readyForUser();
    return;
  }

  const p = (meta && meta.parsed) || {};
  history.push({role:'assistant',content:reply});
  offerSms = !!p.offerSms;
  // 담당자 대시보드로 넘길 요약·분류를 기억해 둡니다.
  if(p.summary) lastSummary = p.summary;
  if(meta && meta.serviceCode){ lastServiceCode = meta.serviceCode; lastServiceName = meta.serviceName||''; }
  if(p.category) lastCategory = p.category;
  // 서버가 실제로 안내한 목록과, 어르신이 고른 자리 — 둘 다 서버가 정해서 보냅니다.
  if(meta && Array.isArray(meta.jobs)) JOBS = meta.jobs;
  if(meta && meta.job) pickedJob = meta.job;

  await pump.flush();          // 마지막 문장까지 재생이 끝나기를 기다립니다
  if(offerSms){ setStatus('문자로 받아보시려면 "문자 보내줘"라고 말씀해 주세요'); }
  if(!active) return;
  readyForUser();
}
async function onUser(text){
  if(!active) return;
  clearIdle();
  abortListening();
  quietRounds=0; emptyRounds=0;   // 어르신 말씀이 들어왔습니다 — 눈금을 되돌립니다
  actions.classList.remove('show');
  setStatus(''); typerow.classList.remove('show');
  history.push({role:'user',content:text});
  // 추가 문자 제안에 대한 응답 처리
  if(awaitingFollowup){
    awaitingFollowup=false;
    const nm=memberName();
    if(/(응|그래|네|예|보내|좋아|해줘|부탁)/.test(text)){
      // 어르신이 찾으시는 것과 비슷한 '다른 일자리'(선택 안 한 나머지) 추천 발송.
      // 목록은 서버가 실제로 안내한 것이므로, 없으면 없다고 말합니다 — 예전에는
      // 하드코딩된 시연용 자리로 되돌아갔습니다.
      const other=JOBS.find(j=>!pickedJob||j.id!==pickedJob.id);
      let m;
      if(other){
        const keep=pickedJob; pickedJob=other;
        const { content, sent } = await requestSms('send').catch(()=>({content:'',sent:false}));
        pickedJob=keep;
        smsSent=true;
        showSentCard(sent?'✅ 다른 일자리도 보냈어요':'📄 다른 일자리도 보여드려요', content); setStatus('');
        m=sent
          ? (nm?nm+' 어르신, ':'')+'어르신께 맞을 만한 다른 일자리도 문자로 보내드렸어요. 도움이 되시길 바라요. 안녕히 가세요!'
          : (nm?nm+' 어르신, ':'')+'어르신께 맞을 만한 다른 일자리도 화면에 띄워드렸어요. 도움이 되시길 바라요. 안녕히 가세요!';
      }else{
        m=(nm?nm+' 어르신, ':'')+'지금은 알려드릴 다른 자리가 없어요. 담당 선생님께 전해드릴게요. 안녕히 가세요!';
      }
      history.push({role:'assistant',content:m}); setStatus(''); await speak(m);
    }else{
      const m='네, 도움이 되셨길 바라요. 안녕히 가세요!';
      history.push({role:'assistant',content:m}); await speak(m);
    }
    return;
  }
  // 문자 요청 감지
  if(offerSms && /(문자|보내|응|그래|좋아|예)/.test(text)){ openKeypad(); return; }
  botTurn();
}

// 발송 완료 카드 표시 (문자 내용 + 받는 번호)
//
// 화면에 보이는 내용 = 실제로 나간 내용. The body used to be rebuilt here from a
// second copy of the server's formatter, so the two could drift and the card
// could show something that was never sent. /sms returns the message it built;
// this only displays it.
function showSentCard(title, content){
  const nm=memberName();
  kpEntry.classList.add('off'); kpConfirm.classList.add('off'); kpSent.classList.remove('off');
  kwrap.classList.remove('hidden');

}

/**
 * 문자 요청 — 어떤 내용을 보낼지는 서버가 정합니다.
 *
 * 일자리면 일자리 번호를, 그 밖의 상담이면 서비스 코드와 요약을 보냅니다 —
 * 담당기관·인터넷 주소는 서버가 복지관 카탈로그에서 직접 읽습니다.
 * Sending identifiers rather than a finished message is the point: with real SMS
 * keys configured, a body the browser dictates would be an open relay.
 */
async function requestSms(kind){
  // 어르신이 아직 "이걸로 할게요"라고 고르지 않았어도, 안내한 자리가 <하나뿐>이면
  // 그게 지금 이야기하던 자리입니다. 그때는 문의 전화번호가 들어간 일자리 문자를
  // 보내드리는 게 맞습니다 — 요약만 가면 정작 필요한 번호가 빠집니다.
  // 두 개 이상일 때는 고르지 않은 채 아무거나 보내지 않습니다. 예전에 하드코딩된
  // 목록에서 JOBS[0]을 집어 보내던 것이 바로 그 실수였습니다.
  const job = pickedJob || (JOBS.length === 1 ? JOBS[0] : null);
  const r = await fetch(API+'/sms',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({
      to:phone, c:CTOKEN, kind,
      jobId: job ? job.id : undefined,
      serviceCode: lastServiceCode || undefined,
      summary: lastSummary || undefined,
    })});
  const d = await r.json().catch(()=>({}));
  // sent 를 함께 돌려줍니다 — 보냈는지 아닌지를 부르는 쪽이 알아야 합니다.
  // 예전에는 content 만 돌려주어서, 문자 키가 없어도 "문자를 보내드렸어요" 라고
  // 말했습니다. 어르신은 오지 않는 문자를 기다리시게 됩니다.
  // Returning only the body made every attempt look successful: with no SMS key
  // Ieumi still said it had sent one, and a senior waits for a text that will
  // never arrive.
  return { content: d.content || '', sent: !!d.sent };
}

async function doSend(){
  const nm=memberName();
  // 실발송 시도: .env에 SMS 키가 있으면 실제 문자 발송, 없으면 화면 표시만 (시연)
  const { content, sent } = await requestSms('send').catch(()=>({content:'',sent:false}));
  smsSent=true;
  showSentCard(sent?'✅ 문자를 보냈어요':'📄 문자 내용을 보여드려요', content); setStatus('');
  // 실제로 보내지 못했으면 보냈다고 말하지 않습니다. 화면에는 그대로 보여드립니다 —
  // 내용을 읽으실 수는 있어야 하니까요.
  const done=sent
    ? (nm?nm+' 어르신, ':'')+'말씀하신 번호로 문자를 보내드렸어요.'
    : (nm?nm+' 어르신, ':'')+'지금은 문자를 보내드릴 수 없어서, 화면에 내용을 띄워드렸어요. 담당 선생님께도 전해드릴게요.';
  history.push({role:'assistant',content:done}); offerSms=false;
  await speak(done);
  if(!active) return;

  // 추가 제안은 '보낼 다른 자리가 실제로 있을 때'만 합니다. 복지·건강 상담이었거나
  // 남은 자리가 없으면 묻지 않고 마무리합니다 — 예전에는 어떤 상담이든 "다른
  // 일자리"를 권했고, 대답해도 보낼 것이 없었습니다.
  const hasOther = JOBS.some(j=>!pickedJob||j.id!==pickedJob.id);
  if(!hasOther){ readyForUser(); return; }
  const fu='그리고 어르신이 찾으시는 일자리와 비슷하거나, 알려드릴 만한 다른 일자리가 또 있으면, 그것도 문자로 보내드릴까요?';
  awaitingFollowup=true; history.push({role:'assistant',content:fu}); await speak(fu); readyForUser();
}
kwrap.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const a=b.dataset.act;
  if(a==='cyes'){ doSend(); return; }

  if(a==='del'){ phone=phone.slice(0,-1); return renderNum(); }
  if(a==='send'){ if(phone.length<10){ num.textContent='번호를 확인해 주세요'; return; } openConfirm(); return; }
  if(phone.length<11){ phone+=b.textContent.trim(); renderNum(); }});
// 문자 받기 버튼 (음성 인식 안 돼도 항상 열 수 있게)
talkBtn.addEventListener('click',()=>{ if(!active) return; listening ? stopListening() : startListening(); });
smsBtn.addEventListener('click',()=>{ if(active) openKeypad(); });

// 인사말은 복지관이 써넣은 자료입니다 — 화면 언어에 맞는 쪽을 씁니다.
// 영어 인사가 비어 있으면 기본 문장을 쓰되, 이음이 이름은 복지관 것을 그대로.
//
// 한 곳에서만 만듭니다. 대기 화면에서 미리 합성해 두는 글자와 통화를 시작할 때
// 말하는 글자가 <한 글자라도> 다르면 캐시가 어긋나서, 미리 만들어 둔 보람이
// 없어집니다.
//
// The greeting is the centre's own content, so it has a column per language
// rather than a dictionary entry. With no English greeting stored, fall back to
// a neutral one that still uses this centre's name for Ieumi. Built in one place
// only: the text pre-synthesised on the idle screen and the text spoken at
// pick-up must match to the character, or the cached clip is never the one
// asked for.
function greetingText(){
  const inEn = LANG()==='en';
  return (inEn && CTX.settings && CTX.settings.greeting_en)
    || (!inEn && CTX.settings && CTX.settings.greeting)
    || (inEn ? 'What can I help you with?'
             : '무엇을 도와드릴까요?');   /* 탐 팀: 인사말 짧게(대기화면에 소개 상시 예정) */
}

// 대기 화면에서 인사말을 미리 합성해 둡니다 (§3-6).
// 클로바는 한 번에 1.8초쯤 걸립니다. 그 1.8초는 어르신이 통화 버튼을 누르고
// 아무 소리도 없이 기다리시는 시간이었습니다. 키오스크는 어차피 서 있으니,
// 그동안 미리 만들어 두면 버튼을 누르는 순간 바로 인사말이 나옵니다.
//
// CLOVA takes ~1.8s per call, and that was 1.8s of silence after the senior
// pressed the call button. The kiosk is standing idle anyway, so it has the clip
// made in advance and the greeting starts the moment the button is pressed.
function prewarmGreeting(){
  try{
    const t = stripForSpeech(greetingText());
    if(!t) return;
    fetch(API+'/tts',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({text:t, c:CTOKEN})}).catch(()=>{});
  }catch(e){}
}

// ---- 시작/종료 ----
async function start(){
  active=true; history=[]; offerSms=false; pickedJob=null; awaitingFollowup=false;
  lastSummary=''; lastCategory=''; smsSent=false; memberInfo=null; phone='';
  lastServiceCode=''; lastServiceName=''; quietRounds=0; emptyRounds=0; sttMode='clova';
  call.classList.remove('invite'); hang.classList.add('show'); actions.classList.remove('show');
  // 서버를 미리 깨웁니다 (§3-6). 기다리지 않습니다 — 인사말을 하는 동안 뒤에서
  // 복지관 설정·날씨·일자리·프롬프트 캐시가 한꺼번에 데워집니다. 어르신이 첫
  // 질문을 말씀하실 때쯤이면 이미 준비가 끝나 있습니다. 실패해도 그냥 넘어갑니다:
  // 예열은 빨라지자고 하는 일이지, 통화를 막을 이유가 되어서는 안 됩니다.
  //
  // Fired and forgotten while the greeting plays. By the time the senior has
  // finished asking, the caches the answer needs are already warm. A failure here
  // is ignored on purpose — warming exists to save time, never to cost a call.
  try{ fetch(API+'/warm',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({c:CTOKEN, lang:LANG()})}).catch(()=>{}); }catch(e){}
  const greet=greetingText();
  history.push({role:'assistant',content:greet});
  await speak(greet); readyForUser();
}
function end(){ active=false; clearIdle(); abortListening(); micRelease(); stopSpeech(); subtitleReset();
  fileRequest();                          // 통화 내용을 담당자 대시보드로 넘깁니다
  call.classList.add('invite'); hang.classList.remove('show'); actions.classList.remove('show'); typerow.classList.remove('show'); kwrap.classList.add('hidden');
  setStatus(''); say('저는 이음이예요 😊<br/>날씨·일자리·복지 무엇이든<br/>편하게 물어보세요.<br/>수화기를 들고 초록 버튼을 눌러 주세요.'); }
call.addEventListener('click',()=>{ if(!active) start(); });
$('#hangBtn').onclick=end;
// 통화 중에 창을 닫아도 접수 기록은 남깁니다.
window.addEventListener('pagehide',()=>{ if(active) fileRequest(); });

// 복지관 설정을 미리 받아 둡니다 (이름·인사말·목소리·명단대조 여부).
loadContext().then(()=>{
  if(CTX.center) document.title=ieumiName()+' · '+CTX.center.name;
  prewarmGreeting();          // 대기 화면에 서 있는 동안 인사말을 미리 만들어 둡니다
});
</script>

<script>
// 화면 언어를 서버에 알려 줍니다 — i18n.js 가 아직 안 떴으면 주소·저장값을 봅니다.
// Tell the server which language the screen is in. i18n.js may not have loaded
// yet when the first turn fires, so fall back to the URL and stored choice.
function LANG(){
  try{ if(window.I18N && window.I18N.lang) return window.I18N.lang; }catch(e){}
  try{
    const q=new URLSearchParams(location.search).get("lang");
    if(q==="en"||q==="ko") return q;
    return localStorage.getItem("ieumi_lang")==="en"?"en":"ko";
  }catch(e){ return "ko"; }
}
</script>
<!-- 언어 전환 (한국어 ⇄ English). 사전에 없는 문장은 한글로 남습니다.
     Language switch. Load with ?lang=en, or ?i18n=debug to list gaps. -->
<script src="i18n-en.js"></script>
<script src="i18n.js"></script>
</body>
